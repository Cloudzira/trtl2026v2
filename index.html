<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mushaf Tajwid</title>
  <style>
    body { margin: 0; font-family: system-ui, sans-serif; background: #f5f1e8; transition: background .2s; }
    body.gelap { background: #0D0F12; color: #fff; }
    header { background: #0f6b4f; color: #fff; padding: 12px; text-align: center; }
    .nav { display: flex; gap: 8px; justify-content: center; align-items: center; margin: 12px; flex-wrap: wrap; }
    button { background: #0f6b4f; color: #fff; border: 0; padding: 8px 14px; border-radius: 6px; cursor: pointer; }
    button:disabled { background: #999; }
    input { width: 70px; padding: 7px; text-align: center; }
    #wrap { text-align: center; padding: 0 8px 24px; }
    #gambar { max-width: 100%; width: 720px; height: auto; box-shadow: 0 2px 10px rgba(0,0,0,.25); }
    #info { margin-top: 8px; font-size: .85rem; opacity: .8; }
  </style>
</head>
<body>
  <header><h2>Mushaf Tajwid</h2></header>

  <div class="nav">
    <button id="next">« Berikutnya</button>
    <input type="number" id="halaman" min="1" max="604" value="1">
    <button id="pergi">Pergi</button>
    <button id="prev">Sebelumnya »</button>
    <button id="tema">🌙 Mode Gelap</button>
  </div>

  <div id="wrap">
    <img id="gambar" alt="Halaman mushaf">
    <div id="info"></div>
  </div>

<script>
  const CDN  = "https://cdn.jsdelivr.net/gh/SakinaDevGroup/mushaf-tajweed-cdn@main";
  const RAW  = "https://raw.githubusercontent.com/SakinaDevGroup/mushaf-tajweed-cdn/main";

  const img = document.getElementById("gambar");
  const input = document.getElementById("halaman");
  const info = document.getElementById("info");

  let halaman = Number(localStorage.getItem("halaman")) || 1;
  let tema = localStorage.getItem("tema") || "light";

  function urlGambar(no, sumber) {
    return `${sumber}/${tema}/p${no}.png`;
  }

  function tampil(no) {
    if (!(no >= 1 && no <= 604)) return;
    halaman = no;

    img.onerror = () => {                    // kalau CDN gagal, coba alamat cadangan
      if (!img.dataset.cadangan) {
        img.dataset.cadangan = "1";
        img.src = urlGambar(no, RAW);
      } else {
        info.textContent = "Gagal memuat gambar. Periksa koneksi internet.";
      }
    };
    delete img.dataset.cadangan;
    img.src = urlGambar(no, CDN);
    img.alt = "Mushaf halaman " + no;

    input.value = no;
    info.textContent = "Halaman " + no + " dari 604";
    document.getElementById("prev").disabled = no <= 1;
    document.getElementById("next").disabled = no >= 604;
    localStorage.setItem("halaman", no);
    window.scrollTo(0, 0);

    // muat halaman sebelah lebih dulu supaya terasa cepat
    [no + 1, no - 1].forEach(n => {
      if (n >= 1 && n <= 604) new Image().src = urlGambar(n, CDN);
    });
  }

  function terapkanTema() {
    document.body.classList.toggle("gelap", tema === "dark");
    document.getElementById("tema").textContent =
      tema === "dark" ? "☀️ Mode Terang" : "🌙 Mode Gelap";
  }

  // Mushaf dibaca dari kanan ke kiri, jadi "Berikutnya" ada di sebelah kiri
  document.getElementById("next").onclick = () => tampil(halaman + 1);
  document.getElementById("prev").onclick = () => tampil(halaman - 1);
  document.getElementById("pergi").onclick = () => tampil(parseInt(input.value));
  document.getElementById("tema").onclick = () => {
    tema = tema === "dark" ? "light" : "dark";
    localStorage.setItem("tema", tema);
    terapkanTema();
    tampil(halaman);
  };
  document.addEventListener("keydown", e => {
    if (e.key === "ArrowLeft") tampil(halaman + 1);
    if (e.key === "ArrowRight") tampil(halaman - 1);
  });

  terapkanTema();
  tampil(halaman);
</script>
</body>
</html>
