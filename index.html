<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Al-Quran Per Halaman</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #f5f1e8; margin: 0; color: #222; }
    header { background: #0f6b4f; color: #fff; padding: 12px 16px; text-align: center; }
    main { max-width: 760px; margin: 0 auto; padding: 16px; }
    .nav { display: flex; gap: 8px; justify-content: center; align-items: center; margin: 12px 0; }
    button { background: #0f6b4f; color: #fff; border: 0; padding: 8px 14px; border-radius: 6px; cursor: pointer; }
    button:disabled { background: #999; }
    input { width: 70px; padding: 7px; text-align: center; }
    .surah { text-align: center; background: #e3efe9; padding: 8px; border-radius: 6px; margin: 16px 0 8px; font-weight: bold; }
    .ayat { background: #fff; border-radius: 8px; padding: 14px; margin-bottom: 10px; }
    .arab { font-family: "Amiri", "Traditional Arabic", serif; font-size: 2rem; line-height: 2.2; direction: rtl; text-align: right; }
    .nomor { font-size: .9rem; color: #0f6b4f; }
    .arti { color: #444; margin-top: 6px; }
  </style>
</head>
<body>
  <header><h2>Al-Quran Per Halaman</h2></header>
  <main>
    <div class="nav">
      <button id="prev">« Sebelumnya</button>
      <input type="number" id="halaman" min="1" max="604" value="1">
      <button id="pergi">Pergi</button>
      <button id="next">Berikutnya »</button>
    </div>
    <div id="isi">Memuat...</div>
  </main>

<script>
  let halaman = 1;
  const isi = document.getElementById("isi");
  const input = document.getElementById("halaman");

  async function muatHalaman(no) {
    isi.textContent = "Memuat...";
    try {
      const url = `https://api.alquran.cloud/v1/page/${no}/editions/quran-uthmani,id.indonesian`;
      const res = await fetch(url);
      const json = await res.json();

      const arab = json.data[0].ayahs;       // teks Arab
      const terjemah = json.data[1].ayahs;   // terjemahan Indonesia

      let html = "";
      let surahTerakhir = null;

      arab.forEach((a, i) => {
        // judul surah muncul saat surah berganti
        if (a.surah.number !== surahTerakhir) {
          html += `<div class="surah">${a.surah.name} (${a.surah.englishName})</div>`;
          surahTerakhir = a.surah.number;
        }
        html += `
          <div class="ayat">
            <div class="arab">${a.text} ﴿${a.numberInSurah}﴾</div>
            <div class="arti"><span class="nomor">${a.surah.number}:${a.numberInSurah}</span> ${terjemah[i].text}</div>
          </div>`;
      });

      isi.innerHTML = html;
      halaman = no;
      input.value = no;
      document.getElementById("prev").disabled = no <= 1;
      document.getElementById("next").disabled = no >= 604;
      window.scrollTo(0, 0);
    } catch (e) {
      isi.textContent = "Gagal memuat data. Periksa koneksi internet.";
    }
  }

  document.getElementById("prev").onclick = () => muatHalaman(halaman - 1);
  document.getElementById("next").onclick = () => muatHalaman(halaman + 1);
  document.getElementById("pergi").onclick = () => {
    const n = parseInt(input.value);
    if (n >= 1 && n <= 604) muatHalaman(n);
  };

  muatHalaman(1);
</script>
</body>
</html>
