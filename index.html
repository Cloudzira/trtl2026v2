<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mushaf Al-Qur'an Digital</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 min-h-screen flex flex-col items-center justify-between p-4">

    <header class="text-center text-white py-2">
        <h1 class="text-xl font-bold">Mushaf Al-Qur'an Digital</h1>
        <p class="text-xs text-emerald-300">Navigasi Halaman (1 - 604)</p>
    </header>

    <main class="w-full max-w-md flex flex-col items-center my-auto">
        <div class="relative w-full bg-amber-50 rounded-lg border-4 border-amber-900 flex justify-center items-center p-2 min-h-[450px]">
            
            <div id="image-loader" class="absolute inset-0 flex items-center justify-center bg-amber-50 text-amber-900 text-sm font-medium z-10">
                Memuat Halaman Mushaf...
            </div>

            <!-- Menggunakan CDN Quran Foundation standar -->
            <img id="mushaf-page-img" src="" alt="Halaman Al-Quran" class="w-full h-auto object-contain max-h-[75vh]" onload="hideLoader()" onerror="showError()">
        </div>

        <div class="flex items-center justify-between w-full mt-4 px-2">
            <button onclick="prevPage()" id="btn-prev" class="bg-emerald-700 hover:bg-emerald-600 disabled:opacity-30 text-white px-4 py-2 rounded-full text-sm font-semibold">
                &larr; Sebelumnya
            </button>
            
            <span id="page-indicator" class="text-white text-sm bg-black/40 px-3 py-1 rounded-full">
                Halaman 1 / 604
            </span>

            <button onclick="nextPage()" id="btn-next" class="bg-emerald-700 hover:bg-emerald-600 disabled:opacity-30 text-white px-4 py-2 rounded-full text-sm font-semibold">
                Selanjutnya &rarr;
            </button>
        </div>
    </main>

    <script>
        let currentPage = 1;
        const totalPages = 604;

        function getPageImageUrl(pageNum) {
            // Format angka menjadi 3 digit (contoh: 1 -> 001)
            const paddedNum = String(pageNum).padStart(3, '0');
            // URL CDN resmi dari quran.com untuk gambar halaman mushaf standar
            return `https://verses.quran.com/wbw/page_images/page${paddedNum}.png`;
        }

        function loadPage(pageNum) {
            showLoader();
            currentPage = pageNum;
            const imgElement = document.getElementById('mushaf-page-img');
            imgElement.src = getPageImageUrl(currentPage);
            
            document.getElementById('page-indicator').innerText = `Halaman ${currentPage} / ${totalPages}`;
            document.getElementById('btn-prev').disabled = currentPage <= 1;
            document.getElementById('btn-next').disabled = currentPage >= totalPages;
        }

        function showLoader() {
            const loader = document.getElementById('image-loader');
            loader.style.display = 'flex';
            loader.innerText = 'Memuat Halaman Mushaf...';
        }

        function hideLoader() {
            document.getElementById('image-loader').style.display = 'none';
        }

        function showError() {
            const loader = document.getElementById('image-loader');
            loader.style.display = 'flex';
            loader.innerText = 'Gagal memuat gambar halaman.';
        }

        function nextPage() {
            if (currentPage < totalPages) loadPage(currentPage + 1);
        }

        function prevPage() {
            if (currentPage > 1) loadPage(currentPage - 1);
        }

        // Jalankan saat pertama dibuka
        loadPage(currentPage);
    </script>
</body>
</html>
