<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplikasi Absensi Wajah Terpadu</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Face-api.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api@latest/dist/face-api.js"></script>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col items-center p-4">

    <!-- Container Utama -->
    <div class="max-w-3xl w-full bg-white shadow-lg rounded-2xl p-6 mt-4">
        <h1 class="text-2xl font-bold text-gray-800 text-center mb-6">Sistem Absensi & Database Wajah</h1>

        <!-- Tombol Navigasi Menu -->
        <div class="flex justify-center gap-4 mb-6">
            <button onclick="switchTab('scan')" id="btn-scan" class="px-5 py-2.5 rounded-xl font-semibold bg-blue-600 text-white shadow">Menu Absen</button>
            <button onclick="switchTab('register')" id="btn-register" class="px-5 py-2.5 rounded-xl font-semibold bg-gray-200 text-gray-700">Pendaftaran Wajah</button>
        </div>

        <!-- MENU 1: ABSENSI -->
        <div id="tab-scan" class="space-y-4">
            <div class="relative w-full aspect-video bg-black rounded-xl overflow-hidden flex items-center justify-center">
                <video id="webcam" autoplay muted playsinline class="absolute inset-0 w-full h-full object-cover -scale-x-100"></video>
                <canvas id="overlay" class="absolute inset-0 w-full h-full -scale-x-100 pointer-events-none"></canvas>
            </div>
            <div class="p-4 rounded-xl bg-gray-50 border border-gray-200 text-center">
                <p id="recognition-result" class="text-lg font-semibold text-gray-700">Memuat sistem AI...</p>
                <div id="match-badge" class="mt-2 hidden inline-block bg-green-100 text-green-700 text-xs font-bold px-3 py-1 rounded-full">
                    Absensi Berhasil Tercatat
                </div>
            </div>
        </div>

        <!-- MENU 2: PENDAFTARAN WAJAH -->
        <div id="tab-register" class="hidden space-y-4">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">ID / NIS</label>
                    <input type="text" id="reg-id" class="w-full border rounded-lg p-2.5" placeholder="Contoh: 101">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Nama Lengkap</label>
                    <input type="text" id="reg-name" class="w-full border rounded-lg p-2.5" placeholder="Contoh: Budi Santoso">
                </div>
                <div class="md:col-span-2">
                    <label class="block text-sm font-medium text-gray-700 mb-1">Kelas</label>
                    <input type="text" id="reg-class" class="w-full border rounded-lg p-2.5" placeholder="Contoh: XII IPA 1">
                </div>
            </div>
            <div class="relative w-full aspect-video bg-black rounded-xl overflow-hidden flex items-center justify-center">
                <video id="reg-webcam" autoplay muted playsinline class="absolute inset-0 w-full h-full object-cover -scale-x-100"></video>
            </div>
            <button onclick="captureAndRegister()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 rounded-xl shadow">
                Ambil Foto & Daftarkan Wajah
            </button>
            <p id="reg-status" class="text-center text-sm font-medium text-gray-600"></p>
        </div>
    </div>

    <!-- Script Utama -->
    <script>
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbykoigdTZqEnWiZz8oD0kMaUckSYZ3pjzak-_4o10x_9TpI6-aivrVjF-T0L7PWLJprzA/exec'; // Ganti URL Anda
        let isModelLoaded = false;
        let faceMatcher = null;
        let lastRecordedTime = {};

        // Switch Tab Menu
        function switchTab(tab) {
            if (tab === 'scan') {
                document.getElementById('tab-scan').classList.remove('hidden');
                document.getElementById('tab-register').classList.add('hidden');
                document.getElementById('btn-scan').className = 'px-5 py-2.5 rounded-xl font-semibold bg-blue-600 text-white shadow';
                document.getElementById('btn-register').className = 'px-5 py-2.5 rounded-xl font-semibold bg-gray-200 text-gray-700';
            } else {
                document.getElementById('tab-scan').classList.add('hidden');
                document.getElementById('tab-register').classList.remove('hidden');
                document.getElementById('btn-register').className = 'px-5 py-2.5 rounded-xl font-semibold bg-blue-600 text-white shadow';
                document.getElementById('btn-scan').className = 'px-5 py-2.5 rounded-xl font-semibold bg-gray-200 text-gray-700';
                startRegCamera();
            }
        }

        // Inisialisasi Kamera Utama (Absen)
        async function startCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { width: 640, height: 480 } });
                document.getElementById('webcam').srcObject = stream;
            } catch (err) {
                console.error("Kamera error:", err);
            }
        }

        // Inisialisasi Kamera Pendaftaran
        async function startRegCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { width: 640, height: 480 } });
                document.getElementById('reg-webcam').srcObject = stream;
            } catch (err) {
                console.error("Kamera pendaftaran error:", err);
            }
        }

        // Muat Model AI
        async function loadModels() {
            const MODEL_URL = 'https://cdn.jsdelivr.net/npm/@vladmandic/face-api@latest/model/';
            const fa = window.faceapi || window.faceapi?.default;

            document.getElementById('recognition-result').innerText = "Memuat model AI...";
            
            await Promise.all([
                fa.nets.tinyFaceDetector.loadFromUri(MODEL_URL),
                fa.nets.faceLandmarkNet.loadFromUri(MODEL_URL),
                fa.nets.faceRecognitionNet.loadFromUri(MODEL_URL)
            ]);

            isModelLoaded = true;
            document.getElementById('recognition-result').innerText = "Memuat database wajah...";
            await loadLabeledImages();
            startCamera();
        }

        // Ambil Data Wajah dari Server
        async function loadLabeledImages() {
            try {
                const response = await fetch(SCRIPT_URL + '?action=getFaces');
                const data = await response.json();
                
                if (!data || data.length === 0) {
                    document.getElementById('recognition-result').innerText = "Belum ada data wajah di database.";
                    return;
                }

                const fa = window.faceapi || window.faceapi?.default;
                const labeledDescriptors = data.map(emp => {
                    const floatDescs = emp.descriptors.map(d => new Float32Array(d));
                    return new fa.LabeledFaceDescriptors(`${emp.id}_${emp.class}_${emp.name}`, floatDescs);
                });

                faceMatcher = new fa.FaceMatcher(labeledDescriptors, 0.55);
                document.getElementById('recognition-result').innerText = "Silakan lihat ke kamera.";
            } catch (err) {
                document.getElementById('recognition-result').innerText = "Gagal memuat database Google Sheets.";
            }
        }

        // Kirim Absensi
        async function sendAttendanceToCloud(id, name, empClass) {
            try {
                await fetch(SCRIPT_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ id, name, class: empClass, status: 'Hadir' })
                });
            } catch (err) {
                console.error(err);
            }
        }

        // Proses Deteksi Realtime (Teks Normal / Tidak Terbalik)
        const video = document.getElementById('webcam');
        const canvas = document.getElementById('overlay');

        video.addEventListener('play', () => {
            const fa = window.faceapi || window.faceapi?.default;
            const displaySize = { width: video.videoWidth || 640, height: video.videoHeight || 480 };
            fa.matchDimensions(canvas, displaySize);

            setInterval(async () => {
                if (!isModelLoaded || video.paused || video.ended || !faceMatcher) return;

                const detections = await fa.detectAllFaces(video, new fa.TinyFaceDetectorOptions()).withFaceLandmarks().withFaceDescriptors();
                const resizedDetections = fa.resizeResults(detections, displaySize);
                
                const ctx = canvas.getContext('2d');
                ctx.clearRect(0, 0, canvas.width, canvas.height);

                if (resizedDetections.length > 0) {
                    resizedDetections.forEach(detection => {
                        const bestMatch = faceMatcher.findBestMatch(detection.descriptor);
                        const box = detection.detection.box;
                        
                        const isKnown = bestMatch.label !== 'unknown';
                        let labelText = 'Tidak Dikenali';
                        let boxColor = '#f43f5e';

                        if (isKnown) {
                            const parts = bestMatch.label.split('_');
                            labelText = parts[2];
                            boxColor = '#10b981';
                        }

                        // Balikkan koordinat khusus teks agar tidak mirror/terbalik
                        ctx.save();
                        ctx.scale(-1, 1);
                        const invertedX = -(box.x + box.width);

                        ctx.strokeStyle = boxColor;
                        ctx.lineWidth = 3;
                        ctx.strokeRect(invertedX, box.y, box.width, box.height);

                        ctx.fillStyle = boxColor;
                        ctx.fillRect(invertedX, box.y - 30, box.width, 30);

                        ctx.fillStyle = '#ffffff';
                        ctx.font = 'bold 14px sans-serif';
                        ctx.fillText(labelText, invertedX + 8, box.y - 10);
                        ctx.restore();

                        if (isKnown) {
                            const parts = bestMatch.label.split('_');
                            const empId = parts[0];
                            const empClass = parts[1];
                            const empName = parts[2];

                            document.getElementById('recognition-result').innerText = `Halo, ${empName} (${empClass})!`;
                            document.getElementById('match-badge').classList.remove('hidden');

                            const nowTime = new Date().getTime();
                            if (!lastRecordedTime[empId] || (nowTime - lastRecordedTime[empId] > 120000)) {
                                lastRecordedTime[empId] = nowTime;
                                sendAttendanceToCloud(empId, empName, empClass);
                            }
                        } else {
                            document.getElementById('recognition-result').innerText = "Wajah tidak terdaftar.";
                            document.getElementById('match-badge').classList.add('hidden');
                        }
                    });
                } else {
                    document.getElementById('recognition-result').innerText = "Memindai wajah di depan kamera...";
                    document.getElementById('match-badge').classList.add('hidden');
                }
            }, 600);
        });

        // Pendaftaran Wajah Baru
        async function captureAndRegister() {
            const id = document.getElementById('reg-id').value.trim();
            const name = document.getElementById('reg-name').value.trim();
            const empClass = document.getElementById('reg-class').value.trim();
            const statusEl = document.getElementById('reg-status');

            if (!id || !name || !empClass) {
                statusEl.innerText = "Harap isi ID, Nama, dan Kelas terlebih dahulu!";
                statusEl.className = "text-center text-sm font-medium text-red-600";
                return;
            }

            statusEl.innerText = "Mendeteksi wajah untuk pendaftaran...";
            statusEl.className = "text-center text-sm font-medium text-blue-600";

            const regVideo = document.getElementById('reg-webcam');
            const fa = window.faceapi || window.faceapi?.default;
            const detection = await fa.detectSingleFace(regVideo, new fa.TinyFaceDetectorOptions()).withFaceLandmarks().withFaceDescriptor();

            if (!detection) {
                statusEl.innerText = "Wajah tidak terdeteksi di kamera. Posisikan wajah dengan benar.";
                statusEl.className = "text-center text-sm font-medium text-red-600";
                return;
            }

            const descriptorArray = Array.from(detection.descriptor);

            try {
                statusEl.innerText = "Menyimpan data ke Google Sheets...";
                await fetch(SCRIPT_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: 'register', id, name, class: empClass, descriptor: descriptorArray })
                });

                statusEl.innerText = "Berhasil! Wajah telah didaftarkan.";
                statusEl.className = "text-center text-sm font-medium text-green-600";
                setTimeout(() => { loadLabeledImages(); switchTab('scan'); }, 2000);
            } catch (err) {
                statusEl.innerText = "Gagal menyimpan data.";
                statusEl.className = "text-center text-sm font-medium text-red-600";
            }
        }

        window.onload = loadModels;
    </script>
</body>
</html>
